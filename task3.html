<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café Table Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="task-three-page">
  <main class="container py-4 py-lg-5">
    <section class="reservation-card mx-auto">
      <header class="reservation-header"><p class="small text-uppercase fw-bold mb-2">Plan your visit</p><h1 class="h2 mb-0">Reserve a table</h1></header>
      <form class="p-3 p-md-4" action="#" method="get">
        <div class="row g-3">
          <div class="col-12 col-md-6"><label class="form-label" for="guest-name">Your name</label><input class="form-control" type="text" id="guest-name" name="guest_name" autocomplete="name" required></div>
          <div class="col-12 col-md-6"><label class="form-label" for="guest-email">Email</label><input class="form-control" type="email" id="guest-email" name="email" autocomplete="email" required></div>
          <div class="col-12 col-md-6"><label class="form-label" for="guest-phone">Phone</label><input class="form-control" type="tel" id="guest-phone" name="phone" autocomplete="tel" required></div>
          <div class="col-12 col-md-6"><label class="form-label" for="guests">Guests</label><input class="form-control" type="number" id="guests" name="guests" min="1" max="12" step="1" value="2" required></div>
          <div class="col-12 col-md-6"><label class="form-label" for="reservation-date">Date</label><input class="form-control" type="date" id="reservation-date" name="date" required></div>
          <fieldset class="col-12 col-md-6"><legend class="form-label">Seating preference</legend><div class="d-flex gap-4 flex-wrap"><div class="form-check"><input class="form-check-input" type="radio" name="seating" id="inside" value="inside" required><label class="form-check-label" for="inside">Inside</label></div><div class="form-check"><input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace"><label class="form-check-label" for="terrace">Terrace</label></div></div></fieldset>
          <div class="col-12"><label class="form-label" for="meal">Meal time</label><select class="form-select" id="meal" name="meal" required><option value="" selected disabled>Choose a time</option><option value="Lunch">Lunch</option><option value="Dinner">Dinner</option></select></div>
          <div class="col-12"><label class="form-label" for="comments">Comments</label><textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Accessibility needs or other requests"></textarea></div>
          <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="terms" name="terms" value="accepted" required><label class="form-check-label" for="terms">I agree to the reservation terms</label></div></div>
          <div class="col-12"><button class="btn btn-primary w-100" type="submit">Reserve</button></div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
